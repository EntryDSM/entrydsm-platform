spring:
  application:
    name: observability
  main:
    lazy-initialization: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
auth:
  jwt:
    # 기본값을 두지 않는다. 미설정이면 기동에 실패해야 알려진 시크릿으로 토큰이 검증되는 일이 없다.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:entrydsm}
monitor:
  # 헬스체크 대상. 논리 서비스마다 실제로 처리하는 서비스 주소를 준다. 기본값은 gateway .env.example 의 로컬 포트를 따른다.
  services:
    identity:
      base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
    auth:
      base-url: ${AUTH_BASE_URL:http://localhost:8081}
    application:
      base-url: ${APPLICATION_BASE_URL:http://localhost:8082}
    evaluation:
      base-url: ${EVALUATION_BASE_URL:http://localhost:8082}
    document:
      base-url: ${DOCUMENT_BASE_URL:http://localhost:8086}
    notification:
      base-url: ${NOTIFICATION_BASE_URL:http://localhost:8084}
    schedule:
      base-url: ${SCHEDULE_BASE_URL:http://localhost:8086}
  round:
    name: ${MONITOR_ROUND_NAME:current}
    from: ${MONITOR_ROUND_FROM:2026-01-01T00:00:00+09:00}
    to: ${MONITOR_ROUND_TO:2026-12-31T23:59:59+09:00}
