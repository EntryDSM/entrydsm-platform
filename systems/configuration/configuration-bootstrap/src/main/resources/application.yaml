spring:
  application:
    name: configuration
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 21MB

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY_SECONDS}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

application:
  grpc:
    # 수험표에 찍을 지원자 정보를 application 에서 읽는다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${APPLICATION_GRPC_HOST:application}
    port: ${APPLICATION_GRPC_PORT:9090}
    deadline-ms: ${APPLICATION_GRPC_DEADLINE_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
