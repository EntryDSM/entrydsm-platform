spring:
  application:
    name: configuration
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 21MB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY_SECONDS}
    environment: ${STORAGE_ENV}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

application:
  grpc:
    # 수험표에 찍을 지원자 정보를 application 에서 읽는다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${APPLICATION_GRPC_HOST:application}
    port: ${APPLICATION_GRPC_PORT:9090}
    deadline-ms: ${APPLICATION_GRPC_DEADLINE_MS:3000}

document:
  # 수험표 제목에 찍는 입학 학년도. 관리자 일괄 출력(admin)도 여기서 그린 수험표를 쓴다.
  admission-year: ${ADMISSION_YEAR:2027}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
