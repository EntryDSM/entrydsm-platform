spring:
  application:
    name: configuration
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 21MB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

aws:
  s3:
    bucket: ${STORAGE_BUCKET}
    internal-buckets: ${AWS_S3_INTERNAL_BUCKETS:${STORAGE_BUCKET}}
    region: ${AWS_S3_REGION}
    presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY_SECONDS}
    environment: ${STORAGE_ENV}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
