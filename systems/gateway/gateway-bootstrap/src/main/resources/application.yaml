spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
    lazy-initialization: false
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            enabled: false
          httpclient:
            connect-timeout: ${gateway.downstream.connect-timeout-millis}
            response-timeout: ${gateway.downstream.response-timeout-millis}ms
          default-filters:
            - name: Retry
              args:
                retries: ${gateway.downstream.retries}
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: ${gateway.downstream.retry-methods}
                backoff:
                  firstBackoff: ${gateway.downstream.retry-first-backoff-millis}ms
                  maxBackoff: ${gateway.downstream.retry-max-backoff-millis}ms
                  factor: ${gateway.downstream.retry-backoff-factor}
                  basedOnPreviousValue: ${gateway.downstream.retry-backoff-based-on-previous-value}
                jitter:
                  randomFactor: ${gateway.downstream.retry-jitter-random-factor}
server:
  port: 8080
  shutdown: graceful
gateway:
  downstream:
    connect-timeout-millis: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT_MILLIS:2000}
    response-timeout-millis: ${GATEWAY_DOWNSTREAM_RESPONSE_TIMEOUT_MILLIS:5000}
    retries: ${GATEWAY_DOWNSTREAM_RETRIES:2}
    retry-methods: GET,HEAD,OPTIONS
    retry-first-backoff-millis: ${GATEWAY_DOWNSTREAM_RETRY_FIRST_BACKOFF_MILLIS:50}
    retry-max-backoff-millis: ${GATEWAY_DOWNSTREAM_RETRY_MAX_BACKOFF_MILLIS:1000}
    retry-backoff-factor: ${GATEWAY_DOWNSTREAM_RETRY_BACKOFF_FACTOR:2}
    retry-backoff-based-on-previous-value: ${GATEWAY_DOWNSTREAM_RETRY_BACKOFF_BASED_ON_PREVIOUS_VALUE:false}
    retry-jitter-random-factor: ${GATEWAY_DOWNSTREAM_RETRY_JITTER_RANDOM_FACTOR:0.5}
  services:
    identity: ${GATEWAY_IDENTITY_URI:http://localhost:8081}
    application: ${GATEWAY_APPLICATION_URI:http://localhost:8082}
    admin: ${GATEWAY_ADMIN_URI:http://localhost:8083}
    notification: ${GATEWAY_NOTIFICATION_URI:http://localhost:8084}
    observability: ${GATEWAY_OBSERVABILITY_URI:http://localhost:8085}
    configuration: ${GATEWAY_CONFIGURATION_URI:http://localhost:8086}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Trace-Id
    max-age-seconds: 3600
  request:
    max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:10485760}
  resilience:
    failure-threshold: ${GATEWAY_CIRCUIT_FAILURE_THRESHOLD:5}
    open-duration-seconds: ${GATEWAY_CIRCUIT_OPEN_DURATION_SECONDS:30}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
