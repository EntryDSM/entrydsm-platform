spring:
  application:
    name: application
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: ${REDIS_CLIENT_NAME:application}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

entrydsm:
  application:
    schedule:
      application-start-at: ${APPLICATION_START_AT}
      application-end-at: ${APPLICATION_END_AT}
      result-announced-at: ${RESULT_ANNOUNCED_AT:}

configuration:
  grpc:
    # 원서 접수 일정은 관리자가 configuration 에 등록한다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${CONFIGURATION_GRPC_HOST:configuration}
    port: ${CONFIGURATION_GRPC_PORT:9090}
    # 원서를 쓰는 요청마다 부르므로 짧게 둔다.
    deadline-ms: ${CONFIGURATION_GRPC_DEADLINE_MS:1000}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
