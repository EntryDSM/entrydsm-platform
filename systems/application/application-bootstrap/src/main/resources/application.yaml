spring:
  application:
    name: application
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: ${REDIS_CLIENT_NAME:application}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

configuration:
  grpc:
    # 파일 저장 및 다운로드만 configuration에 위임한다.
    host: ${CONFIGURATION_GRPC_HOST:configuration}
    port: ${CONFIGURATION_GRPC_PORT:9090}
    # 파일 처리 RPC의 제한 시간.
    deadline-ms: ${CONFIGURATION_GRPC_DEADLINE_MS:10000}

identity:
  grpc:
    host: ${IDENTITY_GRPC_HOST:identity}
    port: ${IDENTITY_GRPC_PORT:9090}
    deadline-ms: ${IDENTITY_GRPC_DEADLINE_MS:1000}

security:
  pii:
    encryption-key-base64: ${APPLICATION_PII_ENCRYPTION_KEY_BASE64}
  snapshot:
    current-key-id: ${APPLICATION_SNAPSHOT_KEY_ID}
    current-key-base64: ${APPLICATION_SNAPSHOT_KEY_BASE64}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

# 정책·전형 기록 이전 및 검증을 완료한 뒤 최종 전환 배포에서 활성화한다.
application:
  administration:
    enabled: ${APPLICATION_ADMINISTRATION_ENABLED:false}
admin:
  screening:
    first-pass-multiplier: ${FIRST_PASS_MULTIPLIER:2}
  storage:
    bucket: ${STORAGE_BUCKET:entrydsm-admin}
    environment: ${STORAGE_ENV:stag}
    download-url-expires-seconds: ${DOWNLOAD_URL_EXPIRES_SECONDS:900}
  maps:
    api-key: ${KAKAO_REST_API_KEY:}
    geocoding-url: ${KAKAO_GEOCODING_URL:https://dapi.kakao.com/v2/local/search/keyword.json}
    directions-url: ${KAKAO_DIRECTIONS_URL:https://apis-navi.kakaomobility.com/v1/directions}
    school-address: ${SCHOOL_ADDRESS:대덕소프트웨어마이스터고등학교}
    timeout-ms: ${KAKAO_API_TIMEOUT_MS:3000}

document:
  storage:
    bucket: ${STORAGE_BUCKET:entrydsm-admin}
  admission-year: ${ADMISSION_YEAR:2027}
  presign-expiry-seconds: ${AWS_S3_PRESIGN_EXPIRY_SECONDS:900}
