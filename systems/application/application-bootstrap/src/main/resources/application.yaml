spring:
  application:
    name: application
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

entrydsm:
  application:
    schedule:
      application-start-at: ${APPLICATION_START_AT}
      application-end-at: ${APPLICATION_END_AT}
      result-announced-at: ${RESULT_ANNOUNCED_AT}

server:
  port: ${SERVER_PORT}
  shutdown: graceful

grpc:
  port: ${GRPC_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
