spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/application_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: ${REDIS_CLIENT_NAME:application}

server:
  port: ${SERVER_PORT:8080}

grpc:
  port: ${GRPC_PORT:9090}

identity:
  grpc:
    host: ${IDENTITY_GRPC_HOST:localhost}
    port: ${IDENTITY_GRPC_PORT:9091}
    deadline-ms: ${IDENTITY_GRPC_DEADLINE_MS:1000}

security:
  pii:
    encryption-key-base64: ${APPLICATION_PII_ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  snapshot:
    current-key-id: ${APPLICATION_SNAPSHOT_KEY_ID:dev}
    current-key-base64: ${APPLICATION_SNAPSHOT_KEY_BASE64:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
