spring:
  application:
    name: identity
  profiles:
    default: dev
  main:
    lazy-initialization: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO

auth:
  jwt:
    issuer: ${JWT_ISSUER:entrydsm-identity}
