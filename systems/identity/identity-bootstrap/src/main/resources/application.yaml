spring:
  application:
    name: identity
  profiles:
    default: local
  main:
    lazy-initialization: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-32}
    issuer: ${JWT_ISSUER:entrydsm-identity}
