spring:
  application:
    name: identity
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: ${REDIS_CLIENT_NAME:identity}
  profiles:
    default: dev
  main:
    lazy-initialization: true
identity:
  redis:
    namespace: ${REDIS_KEY_NAMESPACE:identity}
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED:false}
security:
  cookies:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:}
  pii:
    login-id-hash-key: ${IDENTITY_LOGIN_ID_HASH_KEY}
    encryption-key-base64: ${IDENTITY_PII_ENCRYPTION_KEY_BASE64}
auth:
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  password-reset:
    enabled: ${AUTH_PASSWORD_RESET_ENABLED:true}
    max-attempts: ${AUTH_PASSWORD_RESET_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_PASSWORD_RESET_WINDOW_SECONDS:900}
    max-tracked-login-ids: ${AUTH_PASSWORD_RESET_MAX_TRACKED_LOGIN_IDS:10000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:entrydsm-identity}
pass:
  target: ${PASS_TARGET:PROD}
  cp-code: ${CP_CD:${PASS_CP_CODE:}}
  license: ${PASS_LICENSE:${PASS_LICENSE_FILE_PATH:/tmp/V61290000000_IDS_01_PROD_AES_license.dat}}
  license-file-url: ${PASS_LICENSE_FILE_URL:}
  license-file-path: ${PASS_LICENSE_FILE_PATH:/tmp/V61290000000_IDS_01_PROD_AES_license.dat}
  base-url: ${BASE_URL:}
  site-name: ${SITE_NAME:${PASS_SITE_NAME:EntryDSM}}
  site-url: ${SITE_URL:${PASS_SITE_URL:https://entrydsm.kr}}
  popup-url: ${PASS_POPUP_URL:https://safe.ok-name.co.kr/CommonSvl}
  proof-ttl-seconds: ${PASS_PROOF_TTL_SECONDS:300}
  connect-timeout-ms: ${PASS_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${PASS_READ_TIMEOUT_MS:10000}
  allowed-redirect-origins: ${PASS_ALLOWED_REDIRECT_ORIGINS:${BASE_URL:}}
  proof-key-current: ${PASS_PROOF_KEY_CURRENT:${IDENTITY_LOGIN_ID_HASH_KEY}}
  proof-key-previous: ${PASS_PROOF_KEY_PREVIOUS:}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
