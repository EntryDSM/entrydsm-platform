spring:
  application:
    name: identity
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: ${REDIS_CLIENT_NAME:identity}
  profiles:
    default: dev
  main:
    lazy-initialization: true
identity:
  redis:
    namespace: ${REDIS_KEY_NAMESPACE:identity}
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED:false}
security:
  cookies:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS:}
  pii:
    login-id-hash-key: ${IDENTITY_LOGIN_ID_HASH_KEY:dev-identity-login-id-hash-key-change-me}
    encryption-key-base64: ${IDENTITY_PII_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
auth:
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  password-reset:
    enabled: ${AUTH_PASSWORD_RESET_ENABLED:false}
    max-attempts: ${AUTH_PASSWORD_RESET_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_PASSWORD_RESET_WINDOW_SECONDS:900}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:entrydsm-identity}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
