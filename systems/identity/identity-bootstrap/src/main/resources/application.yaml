spring:
  application:
    name: identity
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      timeout: ${REDIS_COMMAND_TIMEOUT}
      client-name: ${REDIS_CLIENT_NAME}
identity:
  redis:
    namespace: ${REDIS_KEY_NAMESPACE}
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED}
security:
  cookies:
    secure: ${COOKIE_SECURE}
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS}
  pii:
    login-id-hash-key: ${IDENTITY_LOGIN_ID_HASH_KEY}
    encryption-key-base64: ${IDENTITY_PII_ENCRYPTION_KEY_BASE64}
auth:
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH}
  password-reset:
    enabled: ${AUTH_PASSWORD_RESET_ENABLED}
    max-attempts: ${AUTH_PASSWORD_RESET_MAX_ATTEMPTS}
    window-seconds: ${AUTH_PASSWORD_RESET_WINDOW_SECONDS}
    max-tracked-login-ids: ${AUTH_PASSWORD_RESET_MAX_TRACKED_LOGIN_IDS}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
pass:
  target: ${PASS_TARGET}
  cp-code: ${PASS_CP_CODE}
  license: ${PASS_LICENSE}
  license-file-url: ${PASS_LICENSE_FILE_URL}
  license-file-path: ${PASS_LICENSE_FILE_PATH}
  base-url: ${BASE_URL}
  site-name: ${SITE_NAME}
  site-url: ${SITE_URL}
  popup-url: ${PASS_POPUP_URL}
  proof-ttl-seconds: ${PASS_PROOF_TTL_SECONDS}
  connect-timeout-ms: ${PASS_CONNECT_TIMEOUT_MS}
  read-timeout-ms: ${PASS_READ_TIMEOUT_MS}
  allowed-redirect-origins: ${PASS_ALLOWED_REDIRECT_ORIGINS}
  proof-key-current: ${PASS_PROOF_KEY_CURRENT}
  proof-key-previous: ${PASS_PROOF_KEY_PREVIOUS:}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
