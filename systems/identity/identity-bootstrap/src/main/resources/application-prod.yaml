spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # V023-V025 migrations must be applied by the deployment migration runner before startup.
  data:
    redis:
      url: ${REDIS_URL}

auth:
  jwt:
    secret: ${JWT_SECRET}

security:
  pii:
    login-id-hash-key: ${IDENTITY_LOGIN_ID_HASH_KEY}
    encryption-key-base64: ${IDENTITY_PII_ENCRYPTION_KEY_BASE64}
    legacy-plaintext-read-enabled: ${IDENTITY_PII_LEGACY_PLAINTEXT_READ_ENABLED:true}

identity:
  migrations:
    required-version: ${IDENTITY_SCHEMA_REQUIRED_VERSION:V025}
  redis:
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED:true}
