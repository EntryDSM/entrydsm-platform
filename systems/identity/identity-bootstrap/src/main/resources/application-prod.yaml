spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL}

auth:
  jwt:
    secret: ${JWT_SECRET}

security:
  cookies:
    secure: ${COOKIE_SECURE}
  cors:
    allowed-origins: ${IDENTITY_CORS_ALLOWED_ORIGINS}
  pii:
    login-id-hash-key: ${IDENTITY_LOGIN_ID_HASH_KEY}
    encryption-key-base64: ${IDENTITY_PII_ENCRYPTION_KEY_BASE64}

identity:
  redis:
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED:true}
