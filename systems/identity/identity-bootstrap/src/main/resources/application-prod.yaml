spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  # V023__student_profiles_birthdate_date.sql must be applied by the deployment migration runner.
  data:
    redis:
      url: ${REDIS_URL}

auth:
  jwt:
    secret: ${JWT_SECRET}

identity:
  redis:
    durability-check-enabled: ${REDIS_DURABILITY_CHECK_ENABLED:true}
