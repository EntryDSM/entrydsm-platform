spring:
  application:
    name: notification
  profiles:
    default: dev
  main:
    lazy-initialization: true

server:
  shutdown: graceful

grpc:
  port: ${GRPC_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
