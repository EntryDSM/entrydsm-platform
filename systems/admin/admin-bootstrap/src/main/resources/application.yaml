spring:
  application:
    name: admin
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
server:
  port: ${SERVER_PORT}
  shutdown: graceful
admin:
  admission-year: ${ADMISSION_YEAR:2027}
  screening:
    # 1차(서류) 선발 인원 = 지역·전형별 모집 정원 × 배수(올림). 최종은 모집 정원 그대로.
    first-pass-multiplier: ${FIRST_PASS_MULTIPLIER:1.5}
  storage:
    # 리전, 엔드포인트, 자격 증명은 AWS 표준 환경변수(AWS_REGION, AWS_ENDPOINT_URL_S3 등)를 따른다.
    bucket: ${STORAGE_BUCKET:entrydsm-admin}
    download-url-expires-seconds: ${DOWNLOAD_URL_EXPIRES_SECONDS:900}
notification:
  grpc:
    # 공지 등록을 notification 에 위임한다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${NOTIFICATION_GRPC_HOST:notification}
    port: ${NOTIFICATION_GRPC_PORT:9090}
    deadline-ms: ${NOTIFICATION_GRPC_DEADLINE_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
