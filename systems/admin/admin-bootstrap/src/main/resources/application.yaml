spring:
  application:
    name: admin
  main:
    lazy-initialization: true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
server:
  port: ${SERVER_PORT}
  shutdown: graceful
application:
  grpc:
    # 지원자 원서는 application 이 갖는다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${APPLICATION_GRPC_HOST:application}
    port: ${APPLICATION_GRPC_PORT:9090}
    deadline-ms: ${APPLICATION_GRPC_DEADLINE_MS:3000}
    # 목록은 회차 전체를 한 번에 받아 오므로 더 길게 준다.
    list-deadline-ms: ${APPLICATION_GRPC_LIST_DEADLINE_MS:10000}
notification:
  grpc:
    # 공지 등록을 notification 에 위임한다. 기본값은 docker compose 서비스 이름과 포트.
    host: ${NOTIFICATION_GRPC_HOST:notification}
    port: ${NOTIFICATION_GRPC_PORT:9090}
    deadline-ms: ${NOTIFICATION_GRPC_DEADLINE_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
