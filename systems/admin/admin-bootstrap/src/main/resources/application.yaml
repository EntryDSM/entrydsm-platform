spring:
  application:
    name: admin
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/admin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
notification:
  grpc:
    # 공지사항은 notification 이 소유한다. admin 은 등록만 위임한다.
    host: ${NOTIFICATION_GRPC_HOST:localhost}
    port: ${NOTIFICATION_GRPC_PORT:9090}
    deadline-ms: ${NOTIFICATION_GRPC_DEADLINE_MS:3000}
application:
  grpc:
    # 원서 원본은 application 이 소유한다. admin 은 조회하고 전형 결과만 되돌려 준다.
    host: ${APPLICATION_GRPC_HOST:localhost}
    port: ${APPLICATION_GRPC_PORT:9090}
    deadline-ms: ${APPLICATION_GRPC_DEADLINE_MS:5000}
server:
  port: ${SERVER_PORT}
  shutdown: graceful
admin:
  admission-year: ${ADMISSION_YEAR:2027}
  screening:
    # 1차(서류) 선발 인원 = 지역·전형별 모집 정원 × 배수(올림). 최종은 모집 정원 그대로.
    first-pass-multiplier: ${FIRST_PASS_MULTIPLIER:1.5}
  storage:
    # 리전, 엔드포인트, 자격 증명은 AWS 표준 환경변수(AWS_REGION, AWS_ENDPOINT_URL_S3 등)를 따른다.
    bucket: ${STORAGE_BUCKET:entrydsm-admin}
    download-url-expires-seconds: ${DOWNLOAD_URL_EXPIRES_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
