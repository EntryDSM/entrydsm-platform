name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # bazelisk가 .bazelversion(8.5.1)을 읽어 로컬과 동일한 버전으로 실행합니다.
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Build
        run: bazel build //...

      # 제외된 3개 타깃은 CI 도입 이전부터 실패 중입니다. 수정되면 제외 목록을 지워주세요. (#94)
      - name: Test
        run: |
          bazel test --test_output=errors -- //... \
            -//systems/gateway/gateway-adapter-in:test \
            -//systems/gateway/gateway-bootstrap:test \
            -//systems/identity/identity-bootstrap:test
