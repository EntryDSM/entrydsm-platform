name: Build Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel/entrydsm-platform
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-

      - name: 서비스 빌드
        run: bash ./prepare-images.sh gateway identity application notification configuration admin observability

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        run: |
          for service in gateway identity application notification configuration admin observability; do
            docker buildx build --push \
              --build-arg "SERVICE=$service" \
              --tag "ghcr.io/entrydsm/entrydsm-$service:latest" \
              .
          done
