name: Build Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: "choose service"
        required: true
        type: choice
        options:
          - gateway
          - identity
          - application
          - notification
          - configuration
          - admin
          - observability

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel/entrydsm-platform
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-

      - name: 서비스 빌드
        env:
          SERVICE: ${{ inputs.service }}
        run: bash ./prepare-images.sh "$SERVICE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          docker buildx build --push \
            --build-arg "SERVICE=$SERVICE" \
            --tag "ghcr.io/entrydsm/entrydsm-$SERVICE:latest" \
            .
