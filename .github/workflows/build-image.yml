name: Build Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: "choose service"
        required: true
        type: choice
        options:
          - gateway
          - identity
          - application
          - notification
          - configuration
          - admin
          - observability

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE=${{ inputs.service }}
          tags: |
            ghcr.io/entrydsm/entrydsm-${{ inputs.service }}:latest
          cache-from: |
            type=gha,scope=${{ inputs.service }}
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.service }}
