name: Deploy

# ─────────────────────────────────────────────────────────────
# Branch
# develop → STAG 배포
# main    → PROD 배포

# [Secrets]
# STAG_DEPLOY_SSH_KEY
# STAG_DEPLOY_KNOWN_HOSTS
# PROD_DEPLOY_SSH_KEY
# PROD_DEPLOY_KNOWN_HOSTS
# GHCR_TOKEN
#
# [Variables]
# GHCR_USERNAME
# STAG_DEPLOY_HOSTS
#   Ex) ["10.0.1.10"]
# STAG_DEPLOY_USER
#   Ex) ubuntu
# STAG_DEPLOY_PATH
#   Ex) /opt/entrydsm
# STAG_HEALTHCHECK_URL
#   Ex) http://localhost:8080/actuator/health
# PROD_DEPLOY_HOSTS
#   Ex) ["10.0.2.10", "10.0.2.11"]
# PROD_DEPLOY_USER
#   Ex) ubuntu
# PROD_DEPLOY_PATH
#   Ex) /home/ubuntu/entrydsm
# PROD_HEALTHCHECK_URL
#   Ex) http://localhost:8080/actuator/health
#
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - gateway
          - identity
          - application
          - notification
          - configuration
          - admin
          - observability

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel/entrydsm-platform
          key: bazel-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}-
            bazel-${{ runner.os }}-${{ matrix.service }}-

      - name: 서비스 빌드
        run: |
          set -euo pipefail
          
          echo "Building ${{ matrix.service }}"
          bash ./prepare-images.sh "${{ matrix.service }}"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        run: |
          set -euo pipefail
          
          docker buildx build \
            --push \
            --build-arg "SERVICE=${{ matrix.service }}" \
            --tag "ghcr.io/entrydsm/entrydsm-${{ matrix.service }}:latest" \
            .

  deploy-stag:
    name: Deploy STAG

    needs:
      - build

    if: |
      github.ref_name == 'develop' &&
      vars.STAG_DEPLOY_HOSTS != ''

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      max-parallel: 1

      matrix:
        host: ${{ fromJSON(vars.STAG_DEPLOY_HOSTS || '[]') }}

    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.STAG_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAG_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "STAG SSH 설정이 없습니다."
            exit 1
          fi
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: STAG 배포
        env:
          HOST: ${{ matrix.host }}

          DEPLOY_USER: ${{ vars.STAG_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.STAG_DEPLOY_PATH }}

          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR_USERNAME 또는 GHCR_TOKEN이 없습니다."
            exit 1
          fi
          
          printf '%s' "$GHCR_TOKEN" | \
            ssh \
              -i ~/.ssh/id_deploy \
              "$DEPLOY_USER@$HOST" \
              "
              set -e
          
              docker login ghcr.io \
                -u '$GHCR_USERNAME' \
                --password-stdin
          
              cd '$DEPLOY_PATH'
          
              export IMAGE_TAG='$IMAGE_TAG'
          
              docker compose pull
          
              docker compose up -d
          
              docker image prune -f
              "

      - name: STAG 헬스체크
        env:
          HOST: ${{ matrix.host }}

          DEPLOY_USER: ${{ vars.STAG_DEPLOY_USER }}

          HEALTHCHECK_URL: ${{ vars.STAG_HEALTHCHECK_URL || 'http://localhost:8080/actuator/health' }}
        run: |
          for i in $(seq 1 30); do
          
            if ssh \
              -i ~/.ssh/id_deploy \
              "$DEPLOY_USER@$HOST" \
              "curl -fsS '$HEALTHCHECK_URL'" \
              | grep -q '"status":"UP"'; then
          
              echo "$HOST STAG 정상"
              exit 0
          
            fi
          
            echo "$HOST STAG 기동 대기 중... ($i/30)"
            sleep 5
          
          done
          
          echo "$HOST STAG 헬스체크 실패"
          exit 1

  deploy-prod:
    name: Deploy PROD

    needs:
      - build

    if: |
      github.ref_name == 'main' &&
      vars.PROD_DEPLOY_HOSTS != ''

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      max-parallel: 1

      matrix:
        host: ${{ fromJSON(vars.PROD_DEPLOY_HOSTS || '[]') }}

    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "PROD SSH 설정이 없습니다."
            exit 1
          fi
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: PROD 배포
        env:
          HOST: ${{ matrix.host }}

          DEPLOY_USER: ${{ vars.PROD_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}

          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR_USERNAME 또는 GHCR_TOKEN이 없습니다."
            exit 1
          fi
          
          printf '%s' "$GHCR_TOKEN" | \
            ssh \
              -i ~/.ssh/id_deploy \
              "$DEPLOY_USER@$HOST" \
              "
              set -e
          
              docker login ghcr.io \
                -u '$GHCR_USERNAME' \
                --password-stdin
          
              cd '$DEPLOY_PATH'
          
              export IMAGE_TAG='$IMAGE_TAG'
          
              docker compose pull
          
              docker compose up -d
          
              docker image prune -f
              "

      - name: PROD 헬스체크
        env:
          HOST: ${{ matrix.host }}

          DEPLOY_USER: ${{ vars.PROD_DEPLOY_USER }}

          HEALTHCHECK_URL: ${{ vars.PROD_HEALTHCHECK_URL || 'http://localhost:8080/actuator/health' }}
        run: |
          for i in $(seq 1 30); do
          
            if ssh \
              -i ~/.ssh/id_deploy \
              "$DEPLOY_USER@$HOST" \
              "curl -fsS '$HEALTHCHECK_URL'" \
              | grep -q '"status":"UP"'; then
          
              echo "$HOST PROD 정상"
              exit 0
          
            fi
          
            echo "$HOST PROD 기동 대기 중... ($i/30)"
            sleep 5
          
          done
          
          echo "$HOST PROD 헬스체크 실패"
          exit 1
