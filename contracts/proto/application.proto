syntax = "proto3";

package entrydsm.application.v1;

option java_package = "hs.kr.entrydsm.application.grpc";
option java_multiple_files = true;
option java_outer_classname = "ApplicationProto";

service ApplicationService {
    rpc CreateApplication(CreateApplicationRequest) returns (ApplicationResponse);
    rpc GetApplication(GetApplicationRequest) returns (ApplicationResponse);
    rpc CancelApplication(CancelApplicationRequest) returns (ApplicationResponse);
    rpc GetApplicant(GetApplicantRequest) returns (ApplicantResponse);
    rpc ListApplicants(ListApplicantsRequest) returns (ListApplicantsResponse);
    rpc GetApplicationForm(GetApplicationFormRequest) returns (ApplicationFormResponse);
}

message CreateApplicationRequest {
    int64 user_id = 1;
}

message GetApplicationRequest {
    int64 user_id = 1;
}

message CancelApplicationRequest {
    int64 user_id = 1;
    optional string reason = 2;
}

message ApplicationResponse {
    int64 user_id = 1;
    ApplicantStatus applicant_status = 2;
    optional int64 submitted_at_epoch_millis = 3;
    int64 updated_at_epoch_millis = 4;
    PassStatus pass_status = 5;
    optional int64 announced_at_epoch_millis = 6;
}

// 원서 생성 API 응답의 applicant id 로 찾는다. 1번(user_id)은 이전 버전이 쓰던 번호라 다시 쓰지 않는다.
message GetApplicantRequest {
    reserved 1;
    int64 applicant_id = 2;
}

// 제출된 원서 전체를 준다. 필터·페이징은 admin 이 자기 전형 정보와 합친 뒤에야 걸 수 있다.
message ListApplicantsRequest {}

message ListApplicantsResponse {
    repeated ApplicantResponse applicants = 1;
}

// 수험표처럼 원서 내용을 찍는 문서에 쓰는 지원자 정보. 작성 중인 원서면 비어 있을 수 있다.
// user_id 는 원서 주인 계정이라 document 가 본인 판정에 쓴다.
message ApplicantResponse {
    reserved 6;
    int64 user_id = 1;
    optional string name = 2;
    optional string school_name = 3;
    Region region = 4;
    AdmissionType admission_type = 5;
    int64 applicant_id = 7;
    // document 증명사진 ID (photo_ 로 시작)
    optional string photo_file_id = 8;
    // admin 지원자 목록이 쓰는 값. 원서가 작성 중이면 비어 있다.
    // birthdate 를 문자열로 두는 것은 proto 에 날짜 타입이 없고, epoch 로 바꾸면 시간대가 끼어들기 때문이다.
    optional string birthdate = 9;
    optional string phone_number = 10;
    GraduationType graduation_type = 11;
    optional double total_score = 12;
    ApplicantStatus applicant_status = 13;
    optional int64 submitted_at_epoch_millis = 14;
}

// 원서 주인 계정(X-User-Id). 본인 원서만 찍으므로 applicant id 를 받지 않는다.
message GetApplicationFormRequest {
    int64 account_id = 1;
}

// 요강 <서식 1> 입학원서를 찍는 데 쓰는 원서 내용.
// ApplicantResponse 에 얹지 않는 것은 ListApplicants 가 제출 원서 전체를 한 번에 나르기 때문이다.
// 원서가 작성 중이면 대부분 비어 있다.
message ApplicationFormResponse {
    int64 applicant_id = 1;
    int64 user_id = 2;
    ApplicantStatus applicant_status = 3;
    optional string name = 4;
    optional string phone_number = 5;
    // ISO-8601 (yyyy-MM-dd)
    optional string birthdate = 6;
    Gender gender = 7;
    // 우편번호까지 합친 한 줄
    optional string address = 8;
    // document 증명사진 ID (photo_ 로 시작)
    optional string photo_file_id = 9;
    Region region = 10;
    AdmissionType admission_type = 11;
    SpecialAdmissionType special_admission_type = 12;
    GraduationType graduation_type = 13;
    // yyyy-MM
    optional string graduation_date = 14;
    optional string guardian_name = 15;
    optional string guardian_relation = 16;
    optional string guardian_phone_number = 17;
    optional MiddleSchool middle_school = 18;
    // 서식 1 교과성적 표의 네 열. 성적이 없는 열은 담지 않는다.
    // 직전·직전전은 자유학기를 건너뛴 상대 순서라 ScoreCalculator 와 같은 규칙으로 고른다.
    optional SemesterGrades third_grade_second_semester = 19;
    optional SemesterGrades third_grade_first_semester = 20;
    optional SemesterGrades previous_semester = 21;
    optional SemesterGrades second_previous_semester = 22;
    optional AcademicRecord academic_record = 23;
    // 서식 3 자기소개서·학업계획서 본문. 지원자가 쓴 줄바꿈까지 그대로다.
    optional string introduction = 24;
    optional string study_plan = 25;
    optional double subject_score = 26;
    optional double attendance_score = 27;
    optional double volunteer_score = 28;
    optional double additional_score = 29;
    optional double total_score = 30;
}

message MiddleSchool {
    string name = 1;
    string student_number = 2;
    string phone = 3;
    string teacher_name = 4;
    // 기관코드(institution_codes.code). 서식 1 학교코드 칸
    string code = 5;
    // 학교 도로명 주소. 서식 1 출신지역 칸의 원본이다. 기관코드 표에 주소가 없는 학교는 담지 않는다.
    optional string address = 6;
}

// 성취도 A~E. 미이수(자유학기 등)는 요강에 없는 값이라 빈 문자열로 준다.
message SemesterGrades {
    string korean = 1;
    string society = 2;
    string history = 3;
    string math = 4;
    string science = 5;
    string technology = 6;
    string english = 7;
}

// 성적을 한 번도 넣지 않은 원서면 이 값이 없다. 전부 0 인 것과 구분된다.
message AcademicRecord {
    int32 absent_count = 1;
    int32 late_count = 2;
    int32 early_leave_count = 3;
    int32 class_absence_count = 4;
    int32 volunteer_time = 5;
    bool dsm_algorithm_awarded = 6;
    bool programming_certified = 7;
}

message ApplicantStatusChangedEvent {
    string event_id = 1;
    int64 account_id = 2;
    ApplicantStatus applicant_status = 3;
    int64 occurred_at_epoch_millis = 4;
    int64 version = 5;
    optional int64 submitted_at_epoch_millis = 6;
    PassStatus pass_status = 7;
    optional int64 announced_at_epoch_millis = 8;
}

enum ApplicantStatus {
    APPLICANT_STATUS_UNSPECIFIED = 0;
    APPLICANT_STATUS_NONE = 1;
    APPLICANT_STATUS_DRAFT = 2;
    APPLICANT_STATUS_SUBMITTED = 3;
    APPLICANT_STATUS_REVIEWING = 4;
    APPLICANT_STATUS_COMPLETED = 5;
    APPLICANT_STATUS_CANCELED = 6;
}

enum PassStatus {
    PASS_STATUS_UNSPECIFIED = 0;
    PASS_STATUS_NOT_ANNOUNCED = 1;
    PASS_STATUS_PASSED = 2;
    PASS_STATUS_FAILED = 3;
}

enum GraduationType {
    GRADUATION_TYPE_UNSPECIFIED = 0;
    GRADUATION_TYPE_PROSPECTIVE = 1;
    GRADUATION_TYPE_GRADUATED = 2;
    GRADUATION_TYPE_GED = 3;
}

enum Region {
    REGION_UNSPECIFIED = 0;
    REGION_DAEJEON = 1;
    REGION_NATIONAL = 2;
}

enum AdmissionType {
    ADMISSION_TYPE_UNSPECIFIED = 0;
    ADMISSION_TYPE_REGULAR = 1;
    ADMISSION_TYPE_MEISTER = 2;
    ADMISSION_TYPE_SOCIAL = 3;
}

enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
}

enum SpecialAdmissionType {
    SPECIAL_ADMISSION_TYPE_UNSPECIFIED = 0;
    SPECIAL_ADMISSION_TYPE_NONE = 1;
    SPECIAL_ADMISSION_TYPE_NATIONAL_MERIT = 2;
    SPECIAL_ADMISSION_TYPE_SPECIAL_ADMISSION = 3;
}
