syntax = "proto3";

package entrydsm.application.v1;

option java_package = "hs.kr.entrydsm.application.grpc";
option java_multiple_files = true;
option java_outer_classname = "ApplicationProto";

service ApplicationService {
    rpc CreateApplication(CreateApplicationRequest) returns (ApplicationResponse);
    rpc GetApplication(GetApplicationRequest) returns (ApplicationResponse);
    rpc CancelApplication(CancelApplicationRequest) returns (ApplicationResponse);
    // 전형 결과 발표. 결과의 소유자는 application 이고 admin 은 산출한 결과를 위임한다.
    rpc AnnouncePassResults(AnnouncePassResultsRequest) returns (AnnouncePassResultsResponse);
    // 제출된 원서 전체. 지원자 원본의 소유자는 application 이고 admin 은 조회만 한다.
    rpc ListApplicants(ListApplicantsRequest) returns (ListApplicantsResponse);
}

message CreateApplicationRequest {
    int64 user_id = 1;
}

message GetApplicationRequest {
    int64 user_id = 1;
}

message CancelApplicationRequest {
    int64 user_id = 1;
    optional string reason = 2;
}

message ApplicationResponse {
    int64 user_id = 1;
    ApplicantStatus applicant_status = 2;
    optional int64 submitted_at_epoch_millis = 3;
    int64 updated_at_epoch_millis = 4;
    PassStatus pass_status = 5;
    optional int64 announced_at_epoch_millis = 6;
}

enum ApplicantStatus {
    APPLICANT_STATUS_UNSPECIFIED = 0;
    APPLICANT_STATUS_NONE = 1;
    APPLICANT_STATUS_DRAFT = 2;
    APPLICANT_STATUS_SUBMITTED = 3;
    APPLICANT_STATUS_REVIEWING = 4;
    APPLICANT_STATUS_COMPLETED = 5;
    APPLICANT_STATUS_CANCELED = 6;
}

enum PassStatus {
    PASS_STATUS_UNSPECIFIED = 0;
    PASS_STATUS_NOT_ANNOUNCED = 1;
    PASS_STATUS_PASSED = 2;
    PASS_STATUS_FAILED = 3;
}

message AnnouncePassResultsRequest {
    repeated PassResultEntry entries = 1;
}

message PassResultEntry {
    int64 applicant_id = 1;
    ResultType result_type = 2;
    // 발표 결과. PASS_STATUS_NOT_ANNOUNCED 는 발표가 아니므로 거부한다.
    PassStatus result = 3;
    optional int64 processed_by = 4;
    int64 processed_at_epoch_millis = 5;
}

message AnnouncePassResultsResponse {
    int32 applied_count = 1;
}

enum ResultType {
    RESULT_TYPE_UNSPECIFIED = 0;
    RESULT_TYPE_DOCUMENT = 1;
    RESULT_TYPE_FINAL = 2;
}

message ListApplicantsRequest {}

message ListApplicantsResponse {
    repeated ApplicantSummary items = 1;
}

// admin 이 전형을 진행하는 데 필요한 만큼의 원서 정보다.
// 제출 시점에 채워지지 않을 수 있는 값은 optional 로 둔다.
message ApplicantSummary {
    int64 applicant_id = 1;
    int64 user_id = 2;
    string name = 3;
    optional string birth_date = 4;
    string phone_number = 5;
    Region region = 6;
    AdmissionType admission_type = 7;
    GraduationType graduation_type = 8;
    string school_name = 9;
    ApplicantStatus applicant_status = 10;
    optional int64 submitted_at_epoch_millis = 11;
    // 성적이 아직 산출되지 않았으면 비어 있다.
    optional ScoreBreakdown score = 12;
    int64 updated_at_epoch_millis = 13;
}

// 항목 점수는 전형별 반영 비율을 곱하기 전의 원점수이고, 총점은 지원자가 고른 전형 기준이다.
message ScoreBreakdown {
    double subject_score = 1;
    double attendance_score = 2;
    double volunteer_score = 3;
    double total_score = 4;
}

enum Region {
    REGION_UNSPECIFIED = 0;
    REGION_DAEJEON = 1;
    REGION_NATIONAL = 2;
}

enum AdmissionType {
    ADMISSION_TYPE_UNSPECIFIED = 0;
    ADMISSION_TYPE_REGULAR = 1;
    ADMISSION_TYPE_MEISTER = 2;
    ADMISSION_TYPE_SOCIAL = 3;
}

enum GraduationType {
    GRADUATION_TYPE_UNSPECIFIED = 0;
    GRADUATION_TYPE_PROSPECTIVE = 1;
    GRADUATION_TYPE_GRADUATED = 2;
    GRADUATION_TYPE_GED = 3;
}
