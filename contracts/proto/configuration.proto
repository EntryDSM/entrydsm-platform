syntax = "proto3";

package entrydsm.configuration.v1;

option java_package = "hs.kr.entrydsm.configuration.grpc";
option java_multiple_files = true;
option java_outer_classname = "ConfigurationProto";

service ConfigurationService {
    rpc CreateEnvironmentVariable(CreateEnvironmentVariableRequest) returns (EnvironmentVariableResponse);
    rpc GetEnvironmentVariable(GetEnvironmentVariableRequest) returns (EnvironmentVariableResponse);
    rpc GetAllEnvironmentVariables(GetAllEnvironmentVariablesRequest) returns (GetAllEnvironmentVariablesResponse);
    rpc UpdateEnvironmentVariable(UpdateEnvironmentVariableRequest) returns (EnvironmentVariableResponse);
    rpc DeleteEnvironmentVariable(DeleteEnvironmentVariableRequest) returns (DeleteEnvironmentVariableResponse);
    // 관리자 수험표 일괄 출력. 받은 순서대로 수험표를 한 시트에 이어 그린 xlsx 를 저장하지 않고 돌려준다.
    rpc RenderAdmissionTickets(RenderAdmissionTicketsRequest) returns (RenderAdmissionTicketsResponse);
    // 관리자가 등록한 일정 하나. application 이 원서 접수 기간을 확인할 때 쓴다. 없는 제목이면 NOT_FOUND.
    rpc GetSchedule(GetScheduleRequest) returns (ScheduleResponse);
    rpc RenderApplicationEssay(RenderApplicationEssayRequest) returns (RenderApplicationEssayResponse);
}

message CreateEnvironmentVariableRequest {
    string key = 1;
    string value = 2;
    optional string description = 3;
}

message GetEnvironmentVariableRequest {
    string key = 1;
}

message GetAllEnvironmentVariablesRequest {}

message UpdateEnvironmentVariableRequest {
    string key = 1;
    string value = 2;
    optional string description = 3;
}

message DeleteEnvironmentVariableRequest {
    string key = 1;
}

message EnvironmentVariableResponse {
    int64 id = 1;
    string key = 2;
    string value = 3;
    optional string description = 4;
}

message GetAllEnvironmentVariablesResponse {
    repeated EnvironmentVariableResponse items = 1;
}

message DeleteEnvironmentVariableResponse {
    bool success = 1;
}

message RenderAdmissionTicketsRequest {
    // 시트에 찍을 순서대로 담는다.
    repeated AdmissionTicketTarget tickets = 1;
}

message AdmissionTicketTarget {
    int64 applicant_id = 1;
    // admin 이 발급한 수험번호. 없으면 "미발급" 으로 찍는다.
    optional string examinee_number = 2;
}

message RenderAdmissionTicketsResponse {
    // 수험표를 20행 간격으로 이어 그린 xlsx. 증명사진이 한 장에 하나씩 들어가 인원수만큼 커진다.
    bytes xlsx = 1;
}

message GetScheduleRequest {
    // 관리자 화면의 일정 제목. 예: "원서 접수"
    string title = 1;
}

message ScheduleResponse {
    string title = 1;
    // 일정은 한국 시각으로 저장한다. 받는 쪽이 시간대를 몰라도 되게 epoch 로 준다.
    int64 start_at_epoch_millis = 2;
    int64 end_at_epoch_millis = 3;
}

message RenderApplicationEssayRequest {
    int64 applicant_id = 1;
    // 관리자 내보내기에서만 전달한다. 있으면 문서 제목에 수험 번호를 표시한다.
    optional string examinee_number = 2;
}

message RenderApplicationEssayResponse {
    optional bytes introduction_pdf = 1;
    optional bytes study_plan_pdf = 2;
}

// 파일의 내용은 도메인과 무관한 바이트다. 사진 소유자 검증은 호출 서비스에서 수행한다.
service FileStorageService {
  rpc UploadObject(FileObjectRequest) returns (FileObjectResponse);
  rpc DownloadObject(FileObjectRequest) returns (FileObjectResponse);
  rpc DeleteObject(FileObjectRequest) returns (FileObjectResponse);
  rpc PresignObject(FileObjectRequest) returns (FileObjectResponse);
  rpc SaveMetadata(FileMetadataRequest) returns (FileMetadataResponse);
  rpc FindMetadata(FileMetadataRequest) returns (FileMetadataResponse);
  rpc ListMetadata(FileMetadataRequest) returns (FileMetadataResponse);
  rpc DeleteMetadata(FileMetadataRequest) returns (FileMetadataResponse);
}
message FileObjectRequest {
  string bucket = 1;
  string object_key = 2;
  string content_type = 3;
  bytes content = 4;
  int64 expires_in_seconds = 5;
}
message FileObjectResponse {
  bytes content = 1;
  string download_url = 2;
  string checksum = 3;
}
message FileMetadataRequest {
  string metadata_json = 1;
  string public_id = 2;
  int64 legacy_id = 3;
  string object_key = 4;
  string category = 5;
  int32 page = 6;
  int32 size = 7;
}
message FileMetadataResponse {
  optional string metadata_json = 1;
  int64 total_count = 2;
}
