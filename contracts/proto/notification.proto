syntax = "proto3";

package entrydsm.notification.v1;

option java_package = "hs.kr.entrydsm.notification.grpc";
option java_multiple_files = true;
option java_outer_classname = "NotificationProto";

service NotificationService {
    rpc CreateNotice(CreateNoticeRequest) returns (CreateNoticeResponse);
    rpc UpdateNotice(UpdateNoticeRequest) returns (UpdateNoticeResponse);
    rpc DeleteNotice(DeleteNoticeRequest) returns (DeleteNoticeResponse);
    rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
}

message CreateNoticeRequest {
    string title = 1;
    string content = 2;
    // NoticeCategory 이름(ADMISSION_NOTICE, PROSPECTIVE_STUDENT).
    // 한글 이름(입학 공지사항, 예비 신입생 안내)과
    // Notion 명세의 영문 이름(Admissions Notice, Prospective Students Notice)도 받는다.
    string category = 3;
    string author = 4;
    bool is_pinned = 5;
    repeated string attachment_ids = 6;
}

message CreateNoticeResponse {
    int64 notice_id = 1;
    int64 created_at_epoch_millis = 2;
}

// 값이 있는 필드만 바꾸고, 없는 필드는 기존 값을 유지한다.
message UpdateNoticeRequest {
    int64 notice_id = 1;
    optional string title = 2;
    optional string content = 3;
    // CreateNoticeRequest.category 와 같은 이름을 받는다.
    optional string category = 4;
    optional bool is_pinned = 5;
    // 있으면 목록 전체로 교체한다. 빈 목록이면 첨부를 모두 뗀다.
    AttachmentIds attachment_ids = 6;
}

// repeated 필드는 보내지 않은 것과 빈 목록을 구분할 수 없어 메시지로 감싼다.
message AttachmentIds {
    repeated string values = 1;
}

message UpdateNoticeResponse {
    int64 notice_id = 1;
    int64 updated_at_epoch_millis = 2;
}

message DeleteNoticeRequest {
    int64 notice_id = 1;
}

message DeleteNoticeResponse {}

// 관리자가 등록한 답변을 질문(notification 의 faqs 행)에 붙인다.
message AnswerQuestionRequest {
    int64 question_id = 1;
    string content = 2;
    string answered_by = 3;
}

message AnswerQuestionResponse {
    int64 question_id = 1;
    int64 answered_at_epoch_millis = 2;
}
