syntax = "proto3";

package entrydsm.notification.v1;

option java_package = "hs.kr.entrydsm.notification.grpc";
option java_multiple_files = true;
option java_outer_classname = "NotificationProto";

service NotificationService {
    rpc CreateNotice(CreateNoticeRequest) returns (NoticeResponse);
}

message CreateNoticeRequest {
    string title = 1;
    string content = 2;
    NoticeCategory category = 3;
    string author = 4;
}

message NoticeResponse {
    int64 id = 1;
    string title = 2;
    string content = 3;
    NoticeCategory category = 4;
    string author = 5;
    int32 view_count = 6;
    int64 created_at_epoch_millis = 7;
    int64 updated_at_epoch_millis = 8;
}

enum NoticeCategory {
    NOTICE_CATEGORY_UNSPECIFIED = 0;
    NOTICE_CATEGORY_ADMISSION_NOTICE = 1;
    NOTICE_CATEGORY_PROSPECTIVE_STUDENT = 2;
}
